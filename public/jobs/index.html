<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Details — ASHINUR CAREER</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><main class="max-w-6xl mx-auto px-4 py-10"><a href="/" class="text-blue-700 font-bold">← ASHINUR CAREER</a><div id="job" class="mt-6"></div></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const slug=location.pathname.split('/').filter(Boolean).pop();fetch('/api/jobs/'+encodeURIComponent(slug)).then(r=>r.json()).then(d=>{if(d.error){job.innerHTML='<div class="bg-white p-8 rounded-2xl">Job not found.</div>';return}const j=d.job;document.title=j.title+' — ASHINUR CAREER';job.innerHTML=`<div class="bg-white border rounded-3xl p-6 md:p-10"><div class="text-sm font-bold text-blue-700">${e(j.category||'Government Job')}</div><h1 class="text-3xl md:text-5xl font-black mt-2">${e(j.title)}</h1><p class="text-lg text-slate-600 mt-2">${e(j.organization)}</p><div class="grid md:grid-cols-4 gap-3 my-8">${box('Vacancies',j.total_vacancies)}${box('Qualification',j.qualification)}${box('Age Limit',j.age_limit)}${box('Last Date',j.last_date)}</div><div class="space-y-8"><section><h2 class="font-black text-2xl">Overview</h2><p class="mt-2 whitespace-pre-line">${e(j.description||'Not specified in notification')}</p></section><section><h2 class="font-black text-2xl">Eligibility</h2><p class="mt-2 whitespace-pre-line">${e(j.eligibility||'Not specified in notification')}</p></section><section><h2 class="font-black text-2xl">How to Apply</h2><p class="mt-2 whitespace-pre-line">${e(j.how_to_apply||'Not specified in notification')}</p></section></div><div class="mt-10 flex flex-wrap gap-3">${link(j.apply_online_url,'Apply Online')}${link(j.notification_pdf_url,'Official Notification')}${link(j.official_website_url,'Official Website')}</div></div>`});function box(a,b){return `<div class="bg-slate-50 rounded-2xl p-4"><div class="text-xs text-slate-500">${a}</div><b>${e(b||'Not specified')}</b></div>`}function link(u,t){return u?`<a target="_blank" rel="noopener" href="${e(u)}" class="bg-blue-700 text-white px-4 py-3 rounded-xl font-bold">${t}</a>`:''}</script></body></html>
