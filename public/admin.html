<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — ASHINUR CAREER</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-100"><main class="max-w-7xl mx-auto p-4 md:p-8"><div class="flex justify-between"><div><p class="text-blue-700 font-bold">ADMIN</p><h1 class="text-3xl font-black">ASHINUR CAREER Dashboard</h1></div><a href="/" class="text-blue-700">Public site</a></div><div id="login" class="bg-white border rounded-2xl p-6 mt-8 max-w-md"><h2 class="text-xl font-black">Admin Login</h2><input id="u" class="border rounded-xl p-3 w-full mt-4" placeholder="Admin ID"><input id="p" type="password" class="border rounded-xl p-3 w-full mt-3" placeholder="Password"><button onclick="login()" class="mt-4 bg-blue-700 text-white font-bold rounded-xl px-5 py-3">Login</button><div id="err" class="text-red-600 text-sm mt-3"></div></div><div id="dash" class="hidden"><div id="stats" class="grid md:grid-cols-4 gap-4 mt-8"></div><div class="bg-white rounded-2xl border mt-6 p-6"><div class="flex justify-between"><h2 class="text-xl font-black">Jobs</h2><button onclick="logout()" class="text-red-600">Logout</button></div><div id="jobs" class="mt-4 overflow-auto"></div></div><a href="/admin-import" class="inline-block mt-5 bg-blue-700 text-white font-bold rounded-xl px-5 py-3">Import Job Notification</a></div></main><script>async function api(u,o){const r=await fetch(u,o);if(r.status===401)throw Error('AUTH');return r.json()}async function login(){try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});show()}catch{err.textContent='Invalid admin credentials.'}}async function show(){login.classList.add('hidden');dash.classList.remove('hidden');const s=await api('/api/admin/stats');stats.innerHTML=card('Total',s.total)+card('Published',s.published)+card('Draft',s.draft)+card('Expired',s.expired);const d=await api('/api/admin/jobs');jobs.innerHTML=`<table class="min-w-full text-sm"><tr class="text-left border-b"><th class="p-3">Title</th><th class="p-3">Organization</th><th class="p-3">Status</th><th class="p-3">Last Date</th><th class="p-3">Action</th></tr>${d.jobs.map(x=>`<tr class="border-b"><td class="p-3 font-semibold">${x.title}</td><td class="p-3">${x.organization}</td><td class="p-3">${x.status}</td><td class="p-3">${x.last_date||'—'}</td><td class="p-3"><button onclick="del(${x.id})" class="text-red-600">Delete</button></td></tr>`).join('')}</table>`}function card(a,b){return `<div class="bg-white rounded-2xl border p-5"><div class="text-sm text-slate-500">${a}</div><div class="text-3xl font-black mt-1">${b}</div></div>`}async function del(id){if(confirm('Delete this job?')){await api('/api/admin/job/'+id,{method:'DELETE'});show()}}async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}api('/api/admin/me').then(show).catch(()=>{})</script></body></html>
