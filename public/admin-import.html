<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Import — ASHINUR CAREER</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><main class="max-w-4xl mx-auto p-4 md:p-8"><a href="/admin" class="text-blue-700 font-bold">← Admin</a><h1 class="text-3xl font-black mt-4">Job Notification Import</h1><p class="text-slate-600 mt-2">Paste extracted official notification text. Draft only; review before publishing.</p><textarea id="text" class="w-full h-80 border rounded-2xl p-4 mt-6" placeholder="Paste notification text here..."></textarea><button onclick="runImport()" class="mt-4 bg-blue-700 text-white font-bold rounded-xl px-5 py-3">Extract Job Details</button><pre id="out" class="mt-6 bg-slate-900 text-green-300 rounded-2xl p-5 overflow-auto whitespace-pre-wrap"></pre></main><script>async function runImport(){const r=await fetch('/api/admin/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.value})});if(r.status===401){location.href='/admin';return}out.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
